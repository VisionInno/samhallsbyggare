# Stänger av Samhällsbyggarkartan automatiskt kvällen den 24 september 2026.
# Ersätter hela sajten (inklusive /api-funktionen) med den statiska sidan i /stangd.
# Kan även köras för hand: Actions → "Stäng av sajten" → Run workflow → skriv STANG.
name: Stäng av sajten (2026-09-24)

on:
  schedule:
    - cron: "0 20 24 9 *"   # 24 sep kl 20:00 UTC = 22:00 svensk sommartid; jobbet kontrollerar året
  workflow_dispatch:
    inputs:
      bekrafta:
        description: "Skriv STANG för att stänga av sajten nu"
        required: true
        default: ""

jobs:
  stang_av:
    if: github.event_name == 'schedule' || github.event.inputs.bekrafta == 'STANG'
    runs-on: ubuntu-latest
    name: Ersätt sajten med stängt-sidan
    steps:
      - name: Kontrollera att det är rätt år (2026)
        id: ar
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%Y)" != "2026" ]; then
            echo "Schemat gäller bara 2026 – gör ingenting."
            echo "kor=false" >> "$GITHUB_OUTPUT"
          else
            echo "kor=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        if: steps.ar.outputs.kor == 'true'
      - name: Deploya stängt-sidan (utan API)
        if: steps.ar.outputs.kor == 'true'
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PURPLE_BUSH_015972603 }}
          action: "upload"
          app_location: "./stangd"
          api_location: ""
          output_location: "."
          skip_app_build: true
          skip_api_build: true
